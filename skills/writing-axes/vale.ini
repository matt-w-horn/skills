# Vale configuration for journal-copyedit.
# Copy next to the manuscript (with styles/) or run: vale --config <this file> <files>
# TeX is associated to Markdown and masked down to prose via the ignore
# patterns below; Vale has no native TeX parser.

StylesPath = styles
MinAlertLevel = suggestion

[formats]
tex = md

[*.{md,txt,tex}]
BasedOnStyles = Core, USScientific

# Masks (Stage 0): inline/display math; reference-like macros whose arguments
# are identifiers, not prose; remaining bare macros; ``quoted spans'' (a
# conservative default for mechanical rules; SKILL.md covers when a quote is
# editable); TeX comments.
TokenIgnores = (\$+[^$\n]+\$+), (\\(?:cite|ref|eqref|autoref|Cref|cref|label|url|href|texttt|lean|verb|input|include|bibliography|bibliographystyle)\{[^{}]*\}), (\\[A-Za-z@]+), (``[^`']*''), (%[^\n]*)

# Structure-only environments; captions stay outside these and are linted.
BlockIgnores = (?s)(\\begin\{(?:equation|align|alltt|verbatim|lstlisting|tikzpicture|tabular|quote|quotation)\*?\}.*?\\end\{(?:equation|align|alltt|verbatim|lstlisting|tikzpicture|tabular|quote|quotation)\*?\})
